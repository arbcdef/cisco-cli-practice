<body>
<div id="sb"></div>
<main id="term"><div id="out"></div><div class="in"><span id="pr"></span><input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Terminal"></div></main>
<script>
const $=s=>document.querySelector(s),fam=['conf','if','line','vlan','dhcp','ospf'],BAD="% Invalid input detected at '^' marker.";
const okIp=x=>/^(\d{1,3}\.){3}\d{1,3}$/.test(x)&&x.split('.').every(n=>+n<=255);
const nn=x=>x.split('.').reduce((a,b)=>a*256+ +b,0),sn=v=>[24,16,8,0].map(k=>(v>>>k)&255).join('.');
const okMask=x=>okIp(x)&&/^1*0*$/.test(nn(x).toString(2).padStart(32,'0'));
const netOf=(ip,m)=>sn((nn(ip)&nn(m))>>>0),plen=m=>nn(m).toString(2).replace(/0/g,'').length;
function normIf(s){s=s.replace(/\s+/g,'');let m;const q='(\\d+(?:\\/\\d+)*(?:\\.\\d+)?)';
 for(const[r,n]of[['gigabitethernet|gigabit|gig|gi|g','GigabitEthernet'],['fastethernet|fast|fa|f','FastEthernet'],['serial|se|s','Serial']])if(m=s.match(new RegExp('^('+r+')'+q+'$','i')))return n+m[2];
 if(m=s.match(/^vlan(\d+)$/i))return'Vlan'+m[1];return null}
const SW=[...Array(24)].map((_,i)=>'FastEthernet0/'+(i+1)).concat('GigabitEthernet0/1','GigabitEthernet0/2');
const DEV={router:{n:'Router',ifs:['GigabitEthernet0/0','GigabitEthernet0/1','Serial0/0/0']},switch:{n:'Switch',ifs:SW}};
const mkIf=up=>({ip:'',mask:'',up,desc:'',vlan:1,acc:false,tr:false,enc:0,acl:{}});
function fresh(L){const sw=L.dev==='switch',s={dev:L.dev,host:DEV[L.dev].n,secret:'',pass:'',con:{},vty:{},enc:false,banner:'',ifs:{},vlans:{1:'default'},routes:[],gw:'',saved:false,mode:'boot',ctx:null,line:null,dom:'',users:{},rsa:0,nodns:false,pings:{},shown:{},dhcp:{},excl:[],ospf:null,acl:{},pend:false};
 DEV[L.dev].ifs.forEach(n=>{s.ifs[n]=mkIf(sw)});if(sw)s.ifs.Vlan1=mkIf(false);return s}
function getIf(s,n){if(s.ifs[n])return s.ifs[n];if((s.dev==='switch'&&/^Vlan\d+$/.test(n))||(s.dev==='router'&&/\.\d+$/.test(n)&&s.ifs[n.replace(/\.\d+$/,'')]))return s.ifs[n]=mkIf(n.includes('.'));return null}
const E=(s,f)=>{s.ctx.forEach(n=>{f(getIf(s,n))})};
function intf(a,s){const r=a[0].match(/^range\s+([a-z]+\d+\/)(\d+)\s*-\s*(?:[a-z]*\d+\/)?(\d+)$/i);let names=[];
 if(r){for(let i=+r[2];i<=+r[3];i++)names.push(normIf(r[1]+i))}else names=[normIf(a[0])];
 names=names.map(n=>n&&getIf(s,n)?n:null);
 if(!names.length||names.includes(null))return BAD;s.mode='if';s.ctx=names}
function brief(s){let o='Interface'.padEnd(23)+'IP-Address'.padEnd(16)+'OK? Method Status'.padEnd(29)+'Protocol';
 for(const[n,i]of Object.entries(s.ifs))o+='\n'+n.padEnd(23)+(i.ip||'unassigned').padEnd(16)+'YES '+(i.ip?'manual':'unset').padEnd(7)+(i.up?'up':'administratively down').padEnd(22)+(i.up?'up':'down');
 return o}
const sh=n=>n.replace('FastEthernet','Fa').replace('GigabitEthernet','Gi');
function vlans(s){let o='VLAN Name                             Status    Ports\n---- -------------------------------- --------- -------------------------------';
 Object.keys(s.vlans).map(Number).sort((a,b)=>a-b).forEach(v=>{const p=Object.keys(s.ifs).filter(n=>!/^Vlan/.test(n)&&s.ifs[n].vlan===v).map(sh).join(', ');o+='\n'+String(v).padEnd(5)+s.vlans[v].padEnd(33)+'active    '+p});
 return o}
function route(s){const d=s.routes.find(r=>r.startsWith('0.0.0.0 0.0.0.0 ')),o=['Codes: C - connected, S - static, O - OSPF','','Gateway of last resort is '+(d?d.split(' ')[2]+' to network 0.0.0.0':'not set'),''];
 for(const[n,i]of Object.entries(s.ifs))if(i.ip&&i.up)o.push('C    '+netOf(i.ip,i.mask)+'/'+plen(i.mask)+' is directly connected, '+n);
 s.routes.forEach(r=>{const[x,m,g]=r.split(' ');o.push((x==='0.0.0.0'&&m==='0.0.0.0'?'S*   ':'S    ')+x+'/'+plen(m)+' [1/0] via '+g)});
 return o.join('\n')}
function runcfg(s){const sw=s.dev==='switch',pw=p=>s.enc?'7 0822455D0A16':p,o=['Building configuration...','','Current configuration : 1024 bytes','!'];
 if(s.enc)o.push('service password-encryption');
 o.push('!','hostname '+s.host,'!');
 if(s.secret)o.push('enable secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0');

 if(s.nodns)o.push('no ip domain-lookup');
 if(s.dom)o.push('ip domain-name '+s.dom);
 Object.keys(s.users).forEach(u=>o.push('username '+u+' secret 5 $1$buz0$kF4.Dq2VuCkO5mh1AUq2s/'));
 s.excl.forEach(e=>o.push('ip dhcp excluded-address '+e));
 for(const[k,p]of Object.entries(s.dhcp)){o.push('ip dhcp pool '+k);if(p.net)o.push(' network '+p.net+' '+p.mask);if(p.gw)o.push(' default-router '+p.gw);if(p.dns)o.push(' dns-server '+p.dns);o.push('!')}
 o.push('!');
 for(const[n,i]of Object.entries(s.ifs)){const v=/^Vlan/.test(n);
  if(sw&&!v&&!i.acc&&!i.tr&&i.vlan===1&&!i.desc&&i.up)continue;
  o.push('interface '+n);
  if(i.enc)o.push(' encapsulation dot1Q '+i.enc);
  if(i.desc)o.push(' description '+i.desc);
  if(i.acc)o.push(' switchport mode access');
  if(i.vlan!==1)o.push(' switchport access vlan '+i.vlan);
  if(i.tr)o.push(' switchport mode trunk');
  if(i.allow)o.push(' switchport trunk allowed vlan '+i.allow);
  if(i.nat)o.push(' switchport trunk native vlan '+i.nat);
  if(i.ip)o.push(' ip address '+i.ip+' '+i.mask);else if(!sw||v)o.push(' no ip address');

 if(s.gw)o.push('ip default-gateway '+s.gw);
 s.routes.forEach(r=>o.push('ip route '+r));

 [['line con 0',s.con],['line vty 0 4',s.vty]].forEach(([t,l])=>{o.push('!',t);if(l.pw)o.push(' password '+pw(l.pw));if(l.login)o.push(l.local?' login local':' login');if(l.tr)o.push(' transport input '+l.tr)});
 o.push('!','end');return o.join('\n')}
function rsa(bits,s){if(s.host===DEV[s.dev].n)return'% Please define a hostname other than '+s.host+'.';if(!s.dom)return'% Please define a domain-name first.';s.rsa=bits;return'The name for the keys will be: '+s.host+'.'+s.dom+'\n% The key modulus size is '+bits+' bits\n% Generating '+bits+' bit RSA keys, keys will be non-exportable...[OK]'}
function ping(a,s){if(!okIp(a[0]))return'% Unrecognized host or address, or protocol not running.';const hit=Object.values(s.ifs).some(i=>i.ip===a[0]&&i.up);if(hit)s.pings[a[0]]=1;
 return'Type escape sequence to abort.\nSending 5, 100-byte ICMP Echos to '+a[0]+', timeout is 2 seconds:\n'+(hit?'!!!!!\nSuccess rate is 100 percent (5/5), round-trip min/avg/max = 0/0/0 ms':'.....\nSuccess rate is 0 percent (0/5)')}
const acl=(s,n,r)=>{if(!/^(permit|deny)\b/.test(r))return BAD;(s.acl[n]=s.acl[n]||[]).push(r)};
const save=(a,s)=>{s.saved=true;return'Building configuration...\n[OK]'};
const C=[
['user','enable',(a,s)=>{if(s.secret||s.pass)s.pend=true;else s.mode='priv'}],
['priv','disable',(a,s)=>{s.mode='user'}],
['priv','configure terminal',(a,s)=>{s.mode='conf';return'Enter configuration commands, one per line.  End with CNTL/Z.'}],
['priv','show running-config',(a,s)=>{s.shown.run=1;return runcfg(s)}],
['user priv','show ip interface brief',(a,s)=>{s.shown.brief=1;return brief(s)}],
['user priv','show ip route',(a,s)=>{s.shown.route=1;return route(s)}],
['user priv','show vlan brief',(a,s)=>s.dev==='switch'?(s.shown.vlan=1,vlans(s)):BAD],
['user priv','show vlan',(a,s)=>s.dev==='switch'?(s.shown.vlan=1,vlans(s)):BAD],
['user priv','ping %',ping],
['priv','copy running-config startup-config',(a,s)=>{s.saved=true;return'Destination filename [startup-config]?\nBuilding configuration...\n[OK]'}],
['priv','write memory',save],
['priv','write',save],
['conf','hostname %',(a,s)=>{s.host=a[0]}],
['conf','enable secret %',(a,s)=>{s.secret=a[0]}],
['conf','enable password %',(a,s)=>{s.pass=a[0]}],
['conf','service password-encryption',(a,s)=>{s.enc=true}],
['conf','no ip domain-lookup',(a,s)=>{s.nodns=true}],
['conf','ip domain-name %',(a,s)=>{s.dom=a[0]}],
['conf','username % secret %',(a,s)=>{s.users[a[0]]=a[1]}],
['conf','username % password %',(a,s)=>{s.users[a[0]]=a[1]}],
['conf','crypto key generate rsa',(a,s)=>rsa(512,s)],
['conf','crypto key generate rsa modulus %',(a,s)=>rsa(+a[0]||512,s)],
['conf','banner motd *',(a,s)=>{s.banner=a[0].slice(1).split(a[0][0])[0]}],
['conf','interface *',intf],
['conf','line console %',(a,s)=>{s.mode='line';s.line=s.con}],
['conf','line vty % %',(a,s)=>{s.mode='line';s.line=s.vty}],
['conf','vlan %',(a,s)=>{const v=+a[0];if(s.dev!=='switch'||!/^\d+$/.test(a[0])||v<1||v>4094)return BAD;s.vlans[v]=s.vlans[v]||'VLAN'+a[0].padStart(4,'0');s.mode='vlan';s.ctx=v}],
['conf','ip route % % %',(a,s)=>{if(!okIp(a[0])||!okMask(a[1])||!okIp(a[2]))return BAD;const r=a.join(' ');if(!s.routes.includes(r))s.routes.push(r)}],
['conf','ip default-gateway %',(a,s)=>{if(s.dev!=='switch'||!okIp(a[0]))return BAD;s.gw=a[0]}],
['conf','ip dhcp pool %',(a,s)=>{s.dhcp[a[0]]=s.dhcp[a[0]]||{};s.mode='dhcp';s.ctx=a[0]}],
['conf','ip dhcp excluded-address %',(a,s)=>{if(!okIp(a[0]))return BAD;s.excl.push(a[0]+' '+a[0])}],
['conf','ip dhcp excluded-address % %',(a,s)=>{if(!okIp(a[0])||!okIp(a[1]))return BAD;s.excl.push(a[0]+' '+a[1])}],
['conf','router ospf %',(a,s)=>{s.ospf=s.ospf||{id:a[0],nets:[],pas:[]};s.mode='ospf'}],
['conf','access-list % % any',(a,s)=>acl(s,a[0],a[1].toLowerCase()+' any')],
['conf','access-list % % % %',(a,s)=>acl(s,a[0],a[1].toLowerCase()+' '+a[2]+' '+a[3])],
['line','password %',(a,s)=>{s.line.pw=a[0]}],
['line','login',(a,s)=>{s.line.login=true;s.line.local=false}],
['line','login local',(a,s)=>{s.line.login=true;s.line.local=true}],
['line','transport input %',(a,s)=>{s.line.tr=a[0]}],
['line','logging synchronous',()=>{}],
['line','exec-timeout % %',()=>{}],
['vlan','name %',(a,s)=>{s.vlans[s.ctx]=a[0]}],
['dhcp','network % %',(a,s)=>{if(!okIp(a[0])||!okMask(a[1]))return BAD;Object.assign(s.dhcp[s.ctx],{net:a[0],mask:a[1]})}],
['dhcp','default-router %',(a,s)=>{s.dhcp[s.ctx].gw=a[0]}],
['dhcp','dns-server %',(a,s)=>{s.dhcp[s.ctx].dns=a[0]}],
['ospf','router-id %',(a,s)=>{s.ospf.rid=a[0]}],
['ospf','network % % area %',(a,s)=>{if(!okIp(a[0])||!okIp(a[1]))return BAD;s.ospf.nets.push(a[0]+' '+a[1]+' area '+a[2])}],
['ospf','passive-interface %',(a,s)=>{const n=normIf(a[0]);if(!n||!s.ifs[n])return BAD;s.ospf.pas.push(n)}],
['if','ip address % %',(a,s)=>{if(!okIp(a[0])||!okMask(a[1]))return BAD;E(s,i=>{i.ip=a[0];i.mask=a[1]})}],
['if','no shutdown',(a,s)=>{E(s,i=>{i.up=true})}],
['if','shutdown',(a,s)=>{E(s,i=>{i.up=false})}],
['if','description *',(a,s)=>{E(s,i=>{i.desc=a[0]})}],
['if','encapsulation dot1q %',(a,s)=>{if(!s.ctx[0].includes('.')||!/^\d+$/.test(a[0]))return BAD;E(s,i=>{i.enc=+a[0]})}],
['if','switchport mode access',(a,s)=>{if(s.dev!=='switch')return BAD;E(s,i=>{i.acc=true;i.tr=false})}],
['if','switchport mode trunk',(a,s)=>{if(s.dev!=='switch')return BAD;E(s,i=>{i.tr=true;i.acc=false})}],
['if','switchport trunk allowed vlan %',(a,s)=>{E(s,i=>{i.allow=a[0]})}],
['if','switchport trunk native vlan %',(a,s)=>{E(s,i=>{i.nat=a[0]})}],
['if','switchport access vlan %',(a,s)=>{const v=+a[0];if(s.dev!=='switch'||!/^\d+$/.test(a[0])||v<1||v>4094)return BAD;let m='';if(!s.vlans[v]){s.vlans[v]='VLAN'+a[0].padStart(4,'0');m='% Access VLAN does not exist. Creating vlan '+v}E(s,i=>{i.vlan=v});return m}],

];
const inMode=(mm,m)=>mm.split(' ').includes(m),modesFor=s=>['if','line','vlan','dhcp','ospf'].includes(s.mode)?[s.mode,'conf']:[s.mode];
function walk(toks,modes){let cs=[];modes.forEach(m=>C.forEach(c=>{if(inMode(c[0],m))cs.push({c,p:c[1].split(' ')})}));

  const v=cs.filter(x=>{const j=x.p.indexOf('*');if(j>=0&&j<=i)return true;const w=x.p[i];return w&&(/[%*]/.test(w)||w.startsWith(t))});

 return{cs}}
const pick=(r,n)=>r.cs.find(x=>{const j=x.p.indexOf('*');return j>=0?n>j:x.p.length===n});
const args=(p,t)=>{const a=[];p.forEach((w,i)=>{if(w==='%')a.push(t[i]);else if(w==='*')a.push(t.slice(i).join(' '))});return a};
function prompt(s){const m=s.mode;if(m==='boot')return'';
 const x=m==='if'?(s.ctx.length>1?'(config-if-range)#':s.ctx[0].includes('.')?'(config-subif)#':'(config-if)#'):({user:'>',priv:'#',conf:'(config)#',line:'(config-line)#',vlan:'(config-vlan)#',dhcp:'(dhcp-config)#',ospf:'(config-router)#'})[m];

function help(raw){const t=raw.slice(0,-1),sp=!t||/\s$/.test(t),toks=t.trim().split(/\s+/).filter(Boolean),last=sp?'':toks.pop().toLowerCase(),r=walk(toks,modesFor(S)),set=new Set();

 const ws=[...new Set(r.cs.map(x=>x.p[toks.length]).filter(w=>w&&!/[%*]/.test(w)&&w.startsWith(last)))];
 if(ws.length===1)cmd.value=toks.concat(ws[0]).join(' ')+' '}

const LABS0=[
{n:'Lab 1 · Basic router configuration',lv:'Beginner',dev:'router',d:'A new router for a small office. Set its identity, basic security, and the LAN interface.',

const out=$('#out'),term=$('#term'),cmd=$('#cmd');
try{document.documentElement.dataset.theme=localStorage.getItem('pt-theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}
const HELP=["# MENU TOOL (diawali titik dua)", "  :help             tampilkan bantuan ini", "  :labs             daftar semua lab per topik, lengkap dengan level dan progress", "  :start <no>       mulai lab nomor <no>, contoh :start 3", "  :next             pindah ke lab berikutnya", "  :tasks            daftar soal di lab aktif, [x] = sudah selesai", "  :hint [no]        tampilkan command jawaban soal <no>; tanpa nomor = soal pertama yang belum selesai", "  :progress         progress total dan per topik, plus saran lab berikutnya", "  :wipe             hapus progress yang tersimpan", "  :cheat [topik]    contekan syntax IOS beserta fungsinya, contoh :cheat vlan", "  :reset            ulangi lab aktif dari awal (konfigurasi dikosongkan)", "  :theme dark|light ganti tema warna", "  :fs               layar penuh (atau F11)", "  :clear            bersihkan layar", "", "# KEYBOARD", "  Tab               lengkapi command yang diketik sebagian", "  ?                 tampilkan command/argumen yang valid, contoh: show ?", "  Panah atas/bawah  riwayat command", "  Ctrl+Z            sama dengan end: langsung kembali ke mode #", "", "# MODE IOS (lihat prompt di kiri)", "  Router>               user mode, hanya bisa lihat sedikit. Ketik: enable", "  Router#               privileged mode: show, ping, copy. Ketik: configure terminal", "  Router(config)#       global config: pengaturan seluruh perangkat", "  Router(config-if)#    config interface (juga -line, -router, -vlan, dhcp-config)", "  exit = naik satu level, end = langsung ke #", "", "# Syntax IOS lengkap dengan fungsinya: ketik :cheat"].join('\n');
function add(t,c){const d=document.createElement('div');d.textContent=t;if(c)d.className=c;out.append(d);term.scrollTop=term.scrollHeight}
const bar=(n,t)=>'['+'#'.repeat(Math.round(n/t*16)).padEnd(16,'-')+']';
function setPr(){$('#pr').textContent=S.pend?'Password: ':prompt(S);cmd.type=S.pend?'password':'text'}
function chk(){const L=LABS[cur],now=L.t.map(x=>!!x[2](S)),n=now.filter(Boolean).length,tot=L.t.length;
 now.forEach((k,i)=>{if(k&&!done[i])add('[ OK ] task '+(i+1)+' done: '+L.t[i][0],'g')});
 if(n===tot&&!done.every(Boolean))add('\n*** LAB COMPLETE *** (:next to continue, :labs to choose a lab)\n','g');
 done=now;prog[pk(cur)]=Math.max(prog[pk(cur)]||0,n);sv();
 $('#sb').textContent=' IOS CLI | lab '+(cur+1)+'/'+LABS.length+' '+L.n.split(' · ')[1]+' | '+n+'/'+tot+' '+bar(n,tot)+' '+Math.round(n/tot*100)+'% | :help'}
function tasks(){const L=LABS[cur];add('# '+L.n+' ['+L.lv+']','c');add(L.d,'m');L.t.forEach((x,i)=>add((done[i]?'[x] ':'[ ] ')+String(i+1).padStart(2)+'. '+x[0],done[i]?'g':''));add('# :hint <no> to see the command','m')}
function labs(){add('# labs, ordered easy to hard (:start <no>)','c');let k='';LABS.forEach((L,i)=>{if(L.k!==k){k=L.k;add('\n  '+k.toUpperCase(),'m')}const p=prog[pt(L)]||0,t=L.t.length;add((i===cur?'> ':'  ')+String(i+1).padStart(2)+'  '+pt(L).padEnd(40)+L.lv.padEnd(14)+p+'/'+t+(p===t?'  [done]':''),i===cur?'y':p===t?'g':'')})}
function progress(){const g=L=>prog[pt(L)]||0,tot=LABS.reduce((a,L)=>a+L.t.length,0),dn=LABS.reduce((a,L)=>a+g(L),0),fin=LABS.filter(L=>g(L)===L.t.length).length;
 add('# overall progress','c');add(bar(dn,tot)+' '+dn+'/'+tot+' tasks ('+Math.round(dn/tot*100)+'%), '+fin+'/'+LABS.length+' labs complete','g');
 [...new Set(LABS.map(L=>L.k))].forEach(k=>{const l=LABS.filter(L=>L.k===k),a=l.reduce((x,L)=>x+g(L),0),b=l.reduce((x,L)=>x+L.t.length,0);add('  '+k.padEnd(30)+bar(a,b)+' '+a+'/'+b)});
 const nx=LABS.findIndex(L=>g(L)<L.t.length);add(nx<0?'# every lab is complete!':'# next recommended: :start '+(nx+1),'y')}
function cheat(q){const r=CH.filter(([t])=>!q||t.toLowerCase().includes(q.toLowerCase()));
 if(!r.length){add('topics: '+CH.map(x=>x[0]).join(' | '),'y');return}
 r.forEach(([t,rows])=>{add('\n# '+t,'c');rows.forEach(x=>add('  '+x[0].padEnd(38)+x[1]))})}
function fs(){const d=document;try{if(d.fullscreenElement)d.exitFullscreen();else d.documentElement.requestFullscreen().catch(()=>add('full screen was blocked. Press F11.','y'))}catch(e){add('press F11 for full screen.','y')}}
function meta(r){const[c,...a]=r.slice(1).trim().split(/\s+/),k=(c||'help').toLowerCase();
 if(k==='help')add(HELP,'c');
 else if(k==='labs')labs();
 else if(k==='progress'||k==='p')progress();
 else if(k==='wipe'){prog={};sv();add('saved progress erased','y')}
 else if(k==='start'){if(LABS[+a[0]-1])load(+a[0]-1);else add('usage: :start <lab no>, see :labs','y')}
 else if(k==='next')load((cur+1)%LABS.length);
 else if(k==='tasks')tasks();
 else if(k==='hint'){const j=a[0]?+a[0]-1:done.findIndex(x=>!x),t=LABS[cur].t[j];if(t)add('# task '+(j+1)+': '+t[0]+'\n'+t[1].replace(/^/gm,'    '),'y');else add(a[0]?'usage: :hint [task no]':'all tasks done. :next for the next lab','y')}
 else if(k==='reset')load(cur);
 else if(k==='cheat')cheat(a[0]);
 else if(k==='clear'||k==='cls')out.innerHTML='';
 else if(k==='theme'){if(a[0]==='dark'||a[0]==='light'){document.documentElement.dataset.theme=a[0];try{localStorage.setItem('pt-theme',a[0])}catch(e){}}else add('usage: :theme dark|light','y')}
 else if(k==='fs')fs();
 else add('unknown command: '+r+' (ketik :help)','y')}
function load(i,keep){cur=i;const L=LABS[i];S=fresh(L);hist=[];done=L.t.map(()=>false);if(!keep)out.innerHTML='';document.title='IOS CLI - '+L.n.split(' · ')[1];
 add('');tasks();add('# answer "no" to the initial dialog, then type IOS commands. :help for help.','m');
 add('\n         --- System Configuration Dialog ---\n\nWould you like to enter the initial configuration dialog? [yes/no]:');setPr();chk();cmd.focus()}
function go(v){const raw=v.trim();
 if(raw[0]===':'&&!S.pend){add(v,'c');meta(raw);chk();return}
 if(S.mode==='boot'){add(v);if(/^n/i.test(raw)){S.mode='user';add('\nPress RETURN to get started!\n')}else add("% Please answer 'yes' or 'no'.\nWould you like to enter the initial configuration dialog? [yes/no]:");setPr();return}
 if(S.pend){add('Password:');const ok=v===(S.secret||S.pass);S.pend=false;if(ok)S.mode='priv';else add('% Bad secrets');setPr();return}
 add(prompt(S)+v);if(!raw)return;hist.push(v);hi=hist.length;
 if(/\?$/.test(raw)){add(help(raw));return}
 const toks=raw.split(/\s+/),t0=toks[0].toLowerCase(),before=S.mode;let e=null,o,dof=false;
 if(toks.length===1&&/^(ex|exi|exit)$/.test(t0)){if(before==='priv')S.mode='user';else if(before==='conf')S.mode='priv';else if(fam.includes(before)){S.mode='conf';S.ctx=null}}
 else if(toks.length===1&&t0==='end'&&fam.includes(before)){S.mode='priv';S.ctx=null}
 else{let tk=toks,md=modesFor(S);if(t0==='do'&&toks.length>1&&fam.includes(before)){tk=toks.slice(1);md=['priv'];dof=true}
  const r=walk(tk,md),x=r.e?null:pick(r,tk.length);
  if(x){o=x.c[2](args(x.p,tk),S);if(!dof&&fam.includes(before))S.saved=false}else e=r.e?r:{e:'inc'}}
 if(e){const off=[];v.replace(/\S+/g,(m,k)=>{off.push(k);return m});
  if(e.e==='inv'){add(' '.repeat(prompt(S).length+off[e.i+(dof?1:0)])+'^');add(BAD)}
  else if(e.e==='amb')add('% Ambiguous command:  "'+raw+'"');
  else add('% Incomplete command.')}
 else if(o)add(o);
 setPr();chk()}
cmd.addEventListener('keydown',e=>{
 if(e.key==='Enter'){const v=cmd.value;cmd.value='';go(v)}
 else if(e.key==='Tab'){e.preventDefault();tab()}
 else if(e.key==='ArrowUp'){if(hi>0){hi--;cmd.value=hist[hi];e.preventDefault()}}
 else if(e.key==='ArrowDown'){hi=Math.min(hi+1,hist.length);cmd.value=hist[hi]||'';e.preventDefault()}
 else if(e.key==='z'&&e.ctrlKey){e.preventDefault();if(fam.includes(S.mode)){add(prompt(S)+'^Z');S.mode='priv';S.ctx=null;setPr();chk()}}});
document.addEventListener('click',()=>{if(!getSelection().toString())cmd.focus()});
{const t=' Cisco IOS CLI ',w='+'+'-'.repeat(t.length)+'+';[w,'|'+t+'|',w].forEach(l=>add(l,'c'));add('type :help for help, :fs for full screen.','m')}
load(0,true);
</script>
